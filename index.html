<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8d8a83">
<style>:root{color-scheme:light}html,body{margin:0;height:100%;background:#8d8a83;overflow:hidden;overscroll-behavior:none;touch-action:none}</style>
<title>Kafila Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Hanken+Grotesk:wght@400;600;800&display=swap">
<style>
/* Layout: one full-bleed daytime street map. HUD on top, ranking board top right, action dock at the bottom,
   menus are a tear-off ticket (main + stub) over the live street. Single committed daylight look. */
:root{
  --ground:#8d8a83; --veil:rgba(38,26,20,.8); --scrim:rgba(40,28,20,.5);
  --ink:#fbf1e6; --ink-dim:#d8c6b4;
  --paper:#ff9f2e; --paper-ink:#2b1408;
  --marigold:#ff9f2e; --magenta:#e8452c; --teal:#2fb98a; --guard:#4f78d6;
  --font-display:'Bungee',Impact,'Arial Black',sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--font-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:var(--ground)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:absolute;left:0;right:0;top:0;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .grow{flex:1 1 auto}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--veil);font:800 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.chip b{font:400 16px var(--font-display);letter-spacing:0;color:var(--marigold)}
.bands{display:flex;gap:4px}
.band{width:18px;height:10px;border-radius:3px;background:var(--magenta)}
.band.off{background:rgba(255,255,255,.22)}
.icon-btn{pointer-events:auto;width:38px;height:38px;border:0;border-radius:50%;background:var(--veil);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{background:rgba(90,55,38,.92)}
.icon-btn:focus-visible,.act:focus-visible,.btn:focus-visible,#nameIn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.meter{display:flex;flex-direction:column;gap:4px;max-width:520px;width:100%}
.meter .lab{display:flex;justify-content:space-between;font:800 11px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.track{height:10px;border-radius:99px;background:rgba(30,20,14,.55);overflow:hidden}
.fill{height:100%;width:100%;transform-origin:left center;transform:scaleX(0);background:var(--teal);border-radius:99px}
.meter.hype .fill{background:linear-gradient(90deg,var(--magenta),var(--marigold))}
#roles{display:flex;gap:6px;flex-wrap:wrap}
.role{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border-radius:99px;background:var(--veil);font:800 11px var(--font-body)}
.role i{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font:800 10px var(--font-body);font-style:normal;color:#fff;background:var(--c)}
.role.med i{color:#d02a20}
#live{padding:7px 10px;border-radius:12px;background:var(--veil);pointer-events:none;display:flex;gap:7px;align-items:center;font:600 12px var(--font-body);color:var(--ink)}
#job{padding:7px 10px;border-radius:12px;background:var(--veil);pointer-events:none;display:flex;gap:7px;align-items:center;font:600 12px var(--font-body);color:var(--ink)}
#job b{flex:none;font:400 11px var(--font-display);color:#ffd84a;letter-spacing:.08em}
#job span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#live i{flex:none;width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:livepulse 1s infinite}
#live b{flex:none;font:400 12px var(--font-display);color:#ff6b5e;letter-spacing:.08em}
#live span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes livepulse{50%{opacity:.25}}
#side{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:62px;width:188px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#board{padding:8px 10px;border-radius:12px;background:var(--veil);pointer-events:none}
#board .bt{font:800 10px var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px}
#board ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#board li{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:baseline;font:600 12px var(--font-body);padding:1px 0}
#board li b{font:400 12px var(--font-display);color:var(--marigold);font-variant-numeric:tabular-nums}
#board li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board li.me{color:#fff}
#board li.me .n{font-weight:800}
#board li .r{color:var(--ink-dim);font-variant-numeric:tabular-nums}
#mini{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:130px;width:38px;height:132px;border-radius:10px;background:var(--veil);pointer-events:none}

#dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.act{pointer-events:auto;position:relative;overflow:hidden;min-width:118px;height:58px;border:0;border-radius:14px;background:var(--veil);color:var(--ink);font:400 16px var(--font-display);letter-spacing:.04em;touch-action:none;cursor:pointer;padding:0 14px 8px}
.act small{display:block;font:800 10px var(--font-body);letter-spacing:.14em;color:var(--ink-dim);margin-top:1px}
.act .bar{position:absolute;left:12px;right:12px;bottom:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.act .bar i{display:block;height:100%;transform-origin:left center;transform:scaleX(var(--p,1));background:var(--fillc,var(--teal));border-radius:4px}
#btnCheer{--fillc:var(--marigold)}
#btnRun.alert{--fillc:#fff}
#btnCheer.hot{--fillc:#9df0c4}
.act.pressed{background:rgba(95,55,35,.96)}
.act.alert{background:var(--magenta);color:#fff;animation:pulse .5s infinite alternate}
.act.alert small{color:#ffe3d8}
.act.hot{background:#1f7a4f;color:#fff}
.act.hot small{color:#d5f5e4}
@keyframes pulse{to{transform:scale(1.06)}}
#toast{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));padding:9px 16px;border-radius:12px;background:var(--veil);color:var(--ink);font:600 14px var(--font-body);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.1);pointer-events:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,159,46,.9)}

@media (pointer:coarse){
  #dock{justify-content:flex-end;align-items:flex-end;gap:14px}
  .act{min-width:104px;height:76px;font-size:18px}
  .act small{display:none}
  #toast{bottom:calc(108px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:480px){
  #hud{gap:6px;padding-top:8px}
  .row{gap:6px;flex-wrap:nowrap}
  .chip{padding:5px 9px;gap:5px;font-size:10px}
  .chip b{font-size:14px}
  .lbl-w{display:none}
  .icon-btn{width:34px;height:34px}
  #board{width:140px;top:54px;padding:6px 8px}
  #board li{font-size:11px}
  #mini{top:140px}
  .meter{max-width:calc(100% - 156px)}
}
@media (pointer:fine){ .touch-only{display:none!important} }
@media (pointer:coarse){ .kb-only{display:none!important} }

.screen{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;background:var(--scrim);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ticket{display:flex;width:100%;max-width:840px;color:var(--paper-ink);filter:drop-shadow(0 18px 36px rgba(0,0,0,.45));margin:auto}
.ticket .main,.ticket .stub{background:var(--paper)}
.ticket .main{flex:1 1 auto;min-width:0;padding:26px 30px;border-radius:16px 0 0 16px;
  -webkit-mask:radial-gradient(circle 13px at 100% 0,#0000 97%,#000 100%),radial-gradient(circle 13px at 100% 100%,#0000 97%,#000 100%);
  mask:radial-gradient(circle 13px at 100% 0,#0000 97%,#000 100%),radial-gradient(circle 13px at 100% 100%,#0000 97%,#000 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
.ticket .stub{flex:0 0 250px;padding:26px 24px;border-radius:0 16px 16px 0;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;
  -webkit-mask:radial-gradient(circle 13px at 0 0,#0000 97%,#000 100%),radial-gradient(circle 13px at 0 100%,#0000 97%,#000 100%);
  mask:radial-gradient(circle 13px at 0 0,#0000 97%,#000 100%),radial-gradient(circle 13px at 0 100%,#0000 97%,#000 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
.ticket .stub::before{content:'';position:absolute;left:0;top:16px;bottom:16px;border-left:2px dashed rgba(43,20,8,.4)}
.ticket.bad{--paper:var(--magenta)}
.eyebrow{font:800 11px var(--font-body);letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.ticket h1{margin:6px 0 10px;font:400 clamp(34px,8vw,58px)/.95 var(--font-display);letter-spacing:.01em;text-wrap:balance}
.lede{margin:0 0 12px;font:600 16px/1.4 var(--font-body);max-width:48ch}
.rules{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:7px}
.rules li{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline;font:600 13.5px/1.35 var(--font-body)}
.rules b{font:400 13px var(--font-display);letter-spacing:.04em}
.keys{margin:0 0 8px;font:600 13px var(--font-body);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.kb{display:inline-block;padding:1px 7px;border-radius:6px;border:2px solid rgba(43,20,8,.7);font:800 11px var(--font-body);letter-spacing:.06em}
details{margin:0;font:600 13px/1.4 var(--font-body)}
summary{cursor:pointer;font:800 11px var(--font-body);letter-spacing:.14em;text-transform:uppercase;padding:4px 0}
details ul{margin:4px 0 0;padding-left:18px}
details li{margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin:0 0 6px}
.stats div{display:flex;justify-content:space-between;gap:10px;border-bottom:2px dashed rgba(43,20,8,.28);padding-bottom:4px;font:600 14px var(--font-body)}
.stats b{font:400 15px var(--font-display)}
.stub-k{font:800 11px var(--font-body);letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.stub-v{font:400 34px/1 var(--font-display);font-variant-numeric:tabular-nums}
#nameIn{width:100%;box-sizing:border-box;border:2px solid var(--paper-ink);border-radius:10px;background:rgba(255,255,255,.35);color:var(--paper-ink);font:800 16px var(--font-body);padding:9px 12px;-webkit-user-select:text;user-select:text}
#nameIn::placeholder{color:rgba(43,20,8,.55)}
.btn{appearance:none;border:0;cursor:pointer;border-radius:12px;padding:14px 16px;background:var(--paper-ink);color:var(--paper);font:400 18px var(--font-display);letter-spacing:.05em;text-align:center}
.btn:hover{background:#4a2a14}
.btn.ghost{background:transparent;color:var(--paper-ink);box-shadow:inset 0 0 0 2px var(--paper-ink);font-size:13px;padding:9px 10px}
.btn.ghost:hover{background:rgba(43,20,8,.12)}
.btn.ghost.sel{background:var(--paper-ink);color:var(--paper)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hof{list-style:none;margin:0;padding:0;display:grid;gap:3px;font:600 12.5px var(--font-body)}
.hof li{display:grid;grid-template-columns:16px 1fr auto;gap:6px;border-bottom:1px dashed rgba(43,20,8,.25);padding-bottom:2px}
.hof li b{font:400 12px var(--font-display)}
.hof li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute-note{font:600 12px var(--font-body);opacity:.75;text-align:center}
@media (max-width:640px){
  .ticket{flex-direction:column;max-width:440px}
  .ticket .main{border-radius:16px 16px 0 0;padding:22px 22px 18px;
    -webkit-mask:radial-gradient(circle 13px at 0 100%,#0000 97%,#000 100%),radial-gradient(circle 13px at 100% 100%,#0000 97%,#000 100%);
    mask:radial-gradient(circle 13px at 0 100%,#0000 97%,#000 100%),radial-gradient(circle 13px at 100% 100%,#0000 97%,#000 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
  .ticket .stub{flex:0 0 auto;border-radius:0 0 16px 16px;padding:18px 22px 22px;
    -webkit-mask:radial-gradient(circle 13px at 0 0,#0000 97%,#000 100%),radial-gradient(circle 13px at 100% 0,#0000 97%,#000 100%);
    mask:radial-gradient(circle 13px at 0 0,#0000 97%,#000 100%),radial-gradient(circle 13px at 100% 0,#0000 97%,#000 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
  .ticket .stub::before{left:16px;right:16px;top:0;bottom:auto;border-left:0;border-top:2px dashed rgba(43,20,8,.4)}
  .rules li{grid-template-columns:70px 1fr}
  .stats{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} .act.alert{animation:none} }
</style>

<div id="app">
  <canvas id="game" aria-label="Kafila Rush game street"></canvas>
  <canvas id="mini" width="76" height="264" hidden></canvas>

  <div id="hud" hidden>
    <div class="row">
      <div class="chip">Time <b id="hLevel">0:00</b></div>
      <div class="chip"><span id="lblCrowd">Kafila</span> <b id="hCrowd">1</b></div>
      <div class="chip"><span class="lbl-w" id="lblDet">Detained</span> <b id="hDet">0</b></div>
      <div class="chip" id="chipCoin">₹ <b id="hCoin">0</b></div>
      <div class="grow"></div>
      <button class="icon-btn" id="btnMute" aria-label="Mute sound" title="Mute (M)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="muteIcon" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </button>
      <button class="icon-btn" id="btnPause" aria-label="Pause" title="Pause (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
    </div>
    <div class="meter" id="meter">
      <div class="lab"><span id="mLabel">Walk to Jantar Mantar</span><span id="mVal"></span></div>
      <div class="track"><div class="fill" id="mFill"></div></div>
    </div>
    <div id="roles"></div>
  </div>
  <div id="side"><div id="board" hidden><div class="bt">Biggest kafila</div><ol id="boardList"></ol></div>
  <div id="live" hidden><i></i><b>LIVE</b><span id="liveTxt"></span></div>
  <div id="job" hidden><b>JOB</b><span id="jobTxt"></span></div></div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="stick" hidden><div id="knob"></div></div>

  <div id="dock" hidden>
    <button class="act" id="btnRun" type="button"><span id="runLab">RUN</span><small class="kb-only" id="runSub">SHIFT</small><span class="bar"><i id="runBar"></i></span></button>
    <button class="act" id="btnCheer" type="button"><span id="cheerLab">SPEECH</span><small class="kb-only" id="cheerSub">SPACE</small><span class="bar"><i id="cheerBar"></i></span></button>
  </div>

  <div class="screen" id="screen"></div>
</div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const TAU = Math.PI * 2, GOLD = 2.399963, HP = Math.PI / 2;

function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- state ---------- */
const G = {

  cd: 0, stamina: STA_MAX, staDelay: 0, shake: 0, best: 0, rec: 0, lost: 0, det: 0, hints: {}, popT: 0, leaderF: true, police: false, coins: 0, wpn: 0, gnear: null, gcd: 0, sd: 0, sdT: 0, job: null, jobCd: 0, mp: false, flag: false, shopCd: 0, donT: 0, pc: null, pnear: null, pstun: 0, arrests: 0, quota: 14, threat: 0, gassed: 0, jetted: 0, maxK: 1, boardT: 0,

function readInput() {
  let x = 0, y = 0;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) y -= 1;
  if (keys.has('arrowdown') || keys.has('s')) y += 1;
  if (x || y) { const d = Math.hypot(x, y); x /= d; y /= d; }
  else if (stick.id !== null) { const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy); if (d > 10) { const m = Math.min(1, d / 60); x = dx / d * m; y = dy / d * m; } }
  else if (mouse.down) {
    const rc = app.getBoundingClientRect(), p = L.crowds[0].leader;
    const wx = cam.x + (mouse.x - rc.left - view.w / 2) / cam.z, wy = cam.y + (mouse.y - rc.top - view.h / 2) / cam.z;
    const dx = wx - p.x, dy = wy - p.y, d = Math.hypot(dx, dy);

  }
  return { x, y, run: keys.has('shift') || runBtn || mouse.right };
}

function updatePlayer(dt) {

  if (running) { sp *= 1.7; G.stamina = Math.max(0, G.stamina - 38 * dt * Math.max(0.4, 1 - 0.04 * c.rc.student)); G.staDelay = 0.8; }

  if (G.gassed > 0) { sp *= 0.55; G.gassed -= dt; }

  p.vx += (inp.x * sp - p.vx) * k; p.vy += (inp.y * sp - p.vy) * k;
  p.x += p.vx * dt; p.y += p.vy * dt; pushOut(p, LR); pushTraffic(p, LR);
